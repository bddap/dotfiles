
[env]
TERM = "xterm-256color"

[font.bold]
family = "Comic Mono"
style = "Bold"

[font.italic]
family = "Comic Mono"
style = "Italic"

[font.normal]
family = "Comic Mono"
style = "Regular"

# No Ctrl-Backslash binding here, on purpose: a `ReceiveChar` binding is a no-op for
# byte output, and 0x1c-vs-kitty-CSI-u is chosen by terminal mode, not by bindings —
# so Ctrl-\ already reaches whatever's running (0x1c to tmux, CSI-u to zellij).

[[keyboard.bindings]]
action = "CreateNewWindow"
key = "N"
mods = "Control|Shift"

[window]
dynamic_padding = false

[window.padding]
x = 4
y = 4

[general]
live_config_reload = true

[colors.primary]
background = "#F4EDE4"
foreground = "#6B4F3A"

[colors.cursor]
cursor = "#C8553D"

[colors.selection]
text = "CellForeground"
background = "#ECCEB5"

[colors.normal]
black = "#422614"
red = "#AD4D3B"
green = "#3B7F56"
yellow = "#9E6200"
blue = "#556F9D"
magenta = "#8756A5"
cyan = "#0E7D8A"
white = "#D8C3A5"

[colors.bright]
black = "#8D6C59"
red = "#932410"
green = "#046337"
yellow = "#7F4E01"
blue = "#335189"
magenta = "#6D338E"
cyan = "#065E68"
white = "#FEF5EE"
